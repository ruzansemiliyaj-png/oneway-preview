<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Companion Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #111318;
      color: #fff;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #111318;
    }

    .screen {
      display: none;
      min-height: 100vh;
    }

    .screen.active {
      display: block;
    }

    .root-screen {
      padding: 0 18px 100px;
    }

    .back-button {
      border: 0;
      background: transparent;
      padding: 8px 8px 8px 0;
      font-size: 28px;
      color: inherit;
    }

    .discover-header {
      padding-top: 28px;
    }

    .discover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .discover-title {
      font-size: 30px;
      font-weight: 780;
      letter-spacing: -1px;
    }

    .discover-subtitle {
      margin-top: 8px;
      color: #7f8590;
      font-size: 13px;
    }

    .search-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 14px;
      background: #1c1f26;
      color: #d2d5dc;
      font-size: 20px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin: 24px -18px 20px;
      padding: 0 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 0;
      padding: 9px 15px;
      border-radius: 20px;
      background: #1a1d23;
      color: #8d939e;
      font-size: 13px;
    }

    .category.active {
      background: #fff;
      color: #17191e;
      font-weight: 650;
    }

    .character-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .character-card {
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      background: #1a1d23;
      color: #fff;
      text-align: left;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    .character-image {
      position: relative;
      height: 218px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .character-image::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 55%;
      background: linear-gradient(
        to top,
        rgba(15,16,20,.86),
        rgba(15,16,20,0)
      );
    }

    .character-initial {
      position: relative;
      z-index: 1;
      margin-bottom: 43px;
      font-size: 58px;
      font-weight: 800;
      color: rgba(255,255,255,.86);
      text-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    .linwan {
      background:
        radial-gradient(circle at 72% 20%, #93a0b1, transparent 32%),
        linear-gradient(145deg, #485462, #262b35 65%, #17191f);
    }

    .sunian {
      background:
        radial-gradient(circle at 25% 20%, #e1b29a, transparent 35%),
        linear-gradient(145deg, #bd8778, #704f59 60%, #28212a);
    }

    .chenyu {
      background:
        radial-gradient(circle at 75% 18%, #6c7d8f, transparent 34%),
        linear-gradient(145deg, #424d5a, #242a33 62%, #17191d);
    }

    .shenchuan {
      background:
        radial-gradient(circle at 30% 20%, #748b9d, transparent 34%),
        linear-gradient(145deg, #364c60, #202d3a 62%, #14191f);
    }

    .image-tags {
      position: absolute;
      z-index: 2;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .image-tag {
      padding: 5px 8px;
      border-radius: 9px;
      background: rgba(20,22,27,.72);
      color: #e6e8ec;
      font-size: 10px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .character-info {
      padding: 14px 14px 16px;
    }

    .character-name {
      font-size: 17px;
      font-weight: 730;
    }

    .character-description {
      height: 41px;
      margin-top: 7px;
      overflow: hidden;
      color: #9399a4;
      font-size: 12px;
      line-height: 1.65;
    }

    .preview-note {
      margin-top: 22px;
      color: #656b75;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    .section-header {
      padding-top: 30px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 29px;
      font-weight: 760;
    }

    .section-note {
      margin-top: 7px;
      color: #7f8590;
      font-size: 13px;
    }

    .conversation-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .conversation-card {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: #1a1d23;
      color: #fff;
      display: flex;
      align-items: center;
      text-align: left;
    }

    .conversation-avatar {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 18px;
      background: linear-gradient(145deg, #687584, #303741);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .conversation-main {
      flex: 1;
      min-width: 0;
      margin-left: 13px;
    }

    .conversation-name {
      font-size: 16px;
      font-weight: 680;
    }

    .conversation-preview {
      margin-top: 6px;
      overflow: hidden;
      color: #8e949f;
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .conversation-time {
      margin-left: 8px;
      color: #666c76;
      font-size: 10px;
    }

    .profile-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 22px;
      background: #1a1d23;
    }

    .profile-status {
      font-size: 18px;
      font-weight: 680;
    }

    .profile-description {
      margin-top: 7px;
      color: #838995;
      font-size: 12px;
      line-height: 1.7;
    }

    .login-placeholder {
      width: 100%;
      height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #15171c;
      font-weight: 650;
    }

    .settings-list {
      margin-top: 20px;
      overflow: hidden;
      border-radius: 20px;
      background: #1a1d23;
    }

    .settings-row {
      min-height: 58px;
      padding: 0 17px;
      border-bottom: 1px solid #252830;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d9dce2;
      font-size: 14px;
    }

    .settings-row:last-child {
      border-bottom: 0;
    }

    .settings-value {
      color: #707680;
      font-size: 12px;
    }

    .role-detail-screen {
      padding-bottom: 40px;
      background: #101216;
      color: #fff;
    }

    .role-detail-top {
      padding: 18px 20px 0;
    }

    .role-hero {
      position: relative;
      height: 47vh;
      min-height: 340px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .role-big-initial {
      font-size: 100px;
      font-weight: 800;
      color: rgba(255,255,255,.78);
    }

    .role-content {
      padding: 25px 22px;
    }

    .role-name {
      font-size: 29px;
      font-weight: 780;
    }

    .role-tags {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .role-tag {
      padding: 6px 9px;
      border-radius: 10px;
      background: #1d2026;
      color: #aeb3bc;
      font-size: 11px;
    }

    .role-quote {
      margin-top: 26px;
      color: #e7e8eb;
      font-size: 18px;
      line-height: 1.75;
    }

    .role-about {
      margin-top: 18px;
      color: #858b95;
      font-size: 13px;
      line-height: 1.75;
    }

    .meet-button {
      width: 100%;
      height: 55px;
      margin-top: 28px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      color: #15171b;
      font-size: 16px;
      font-weight: 700;
    }

    .chat-screen {
      position: relative;
      min-height: 100vh;
      padding: 18px 20px 132px;
      overflow-x: hidden;
      overflow-y: visible;
      color: #242b32;
      background: #dce3e8;
    }

    .chat-screen::before,
    .chat-screen::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      opacity: .55;
    }

    .chat-screen::before {
      width: 320px;
      height: 320px;
      top: 80px;
      right: -140px;
      background: rgba(255,255,255,.5);
    }

    .chat-screen::after {
      width: 280px;
      height: 280px;
      left: -130px;
      bottom: 70px;
      background: rgba(101,125,145,.18);
    }

    .chat-linwan {
      background:
        radial-gradient(circle at 78% 16%, rgba(255,255,255,.74), transparent 30%),
        radial-gradient(circle at 15% 72%, rgba(104,127,145,.16), transparent 38%),
        linear-gradient(165deg, #eef2f4 0%, #d7e0e6 52%, #c3d0d8 100%);
    }

    .chat-sunian {
      background:
        radial-gradient(circle at 20% 15%, rgba(255,244,225,.85), transparent 31%),
        radial-gradient(circle at 85% 75%, rgba(189,122,106,.17), transparent 37%),
        linear-gradient(165deg, #f8eee5 0%, #f0d8c9 55%, #dfbdaf 100%);
    }

    .chat-chenyu {
      background:
        radial-gradient(circle at 78% 15%, rgba(255,255,255,.58), transparent 28%),
        radial-gradient(circle at 13% 72%, rgba(75,91,105,.17), transparent 38%),
        linear-gradient(165deg, #e8ecef 0%, #ced6dc 55%, #b6c0c8 100%);
    }

    .chat-shenchuan {
      background:
        radial-gradient(circle at 75% 15%, rgba(235,242,246,.58), transparent 28%),
        radial-gradient(circle at 15% 72%, rgba(55,78,96,.19), transparent 38%),
        linear-gradient(165deg, #dde5e9 0%, #c2d0d8 53%, #9fb2be 100%);
    }

    .chat-header {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: rgba(78,94,108,.7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(55,70,82,.15);
    }

    .chat-name {
      font-size: 18px;
      font-weight: 730;
    }

    .chat-status {
      margin-top: 3px;
      color: rgba(45,57,67,.55);
      font-size: 11px;
    }

    .memory-link {
      border: 0;
      background: transparent;
      color: rgba(45,57,67,.6);
      font-size: 12px;
    }

    .chat-feed {
      position: relative;
      z-index: 3;
      padding: 46px 5px 18px;
    }

    .time-line {
      margin: 0 0 20px;
      color: rgba(42,53,62,.42);
      font-size: 11px;
    }

    .ai-entry {
      max-width: 92%;
      margin-bottom: 20px;
    }

    .speaker {
      margin-bottom: 5px;
      color: rgba(45,56,65,.55);
      font-size: 11px;
      font-weight: 650;
    }

    .ai-text {
      color: #273039;
      font-size: 18px;
      line-height: 1.55;
      white-space: pre-line;
      letter-spacing: .1px;
    }

    .user-entry {
      display: flex;
      justify-content: flex-end;
      margin: 4px 0 20px;
    }

    .user-message {
      max-width: 82%;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 16px 16px 5px 16px;
      background: rgba(255,255,255,.38);
      color: #303940;
      font-size: 15px;
      line-height: 1.5;
      box-shadow: 0 8px 25px rgba(66,82,95,.06);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .typing {
      margin: -4px 0 18px;
      color: rgba(44,57,67,.48);
      font-size: 12px;
    }

    .intro-actions {
      position: relative;
      z-index: 5;
      margin-top: 4px;
    }

    .intro-actions.hidden {
      display: none;
    }

    .continue-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 18px;
      background: rgba(37,48,57,.9);
      color: #fff;
      font-size: 15px;
      font-weight: 650;
      box-shadow: 0 12px 30px rgba(53,67,79,.15);
    }

    .talk-button {
      width: 100%;
      height: 48px;
      margin-top: 9px;
      border: 1px solid rgba(60,76,88,.13);
      border-radius: 18px;
      background: rgba(255,255,255,.34);
      color: #3b4852;
      font-size: 14px;
      font-weight: 600;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .finish-button {
      width: 100%;
      padding: 15px 10px 4px;
      border: 0;
      background: transparent;
      color: rgba(52,65,75,.48);
      font-size: 12px;
    }

    .composer {
      display: none;
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(70,84,95,.08);
      background: rgba(230,237,241,.78);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
    }

    .composer.active {
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 15px;
      border: 1px solid rgba(72,87,99,.09);
      outline: none;
      border-radius: 17px;
      background: rgba(255,255,255,.62);
      color: #28333c;
      font-size: 15px;
      box-shadow: 0 7px 20px rgba(61,77,89,.05);
    }

    .chat-input::placeholder {
      color: rgba(49,63,73,.38);
    }

    .send-button {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 16px;
      background: #34434e;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    .memory-screen {
      padding: 20px 20px 50px;
      background: #f4f6f7;
      color: #20262c;
    }

    .memory-title {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 760;
    }

    .memory-subtitle {
      margin-top: 8px;
      margin-bottom: 30px;
      color: #9298a0;
      font-size: 13px;
      line-height: 1.65;
    }

    .memory-section-title {
      margin: 27px 4px 10px;
      color: #9298a0;
      font-size: 12px;
    }

    .memory-card {
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(25,35,50,.04);
    }

    .memory-item {
      padding: 18px;
      border-bottom: 1px solid #f0f1f3;
    }

    .memory-item:last-child {
      border-bottom: 0;
    }

    .memory-text {
      font-size: 14px;
      line-height: 1.68;
    }

    .memory-meta {
      margin-top: 7px;
      color: #a2a6ad;
      font-size: 10px;
    }

    .empty-memory {
      padding: 20px 18px;
      color: #9aa0a8;
      font-size: 13px;
      line-height: 1.7;
    }

    .nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 79px;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid rgba(255,255,255,.05);
      background: rgba(17,19,24,.94);
      display: flex;
      align-items: center;
      justify-content: space-around;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .nav.hidden {
      display: none;
    }

    .nav-item {
      min-width: 90px;
      height: 52px;
      border: 0;
      background: transparent;
      color: #676d77;
      font-size: 13px;
    }

    .nav-item.active {
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="app">

  <section id="discoverScreen" class="screen root-screen active">

    <div class="discover-header">

      <div class="discover-top">

        <div>

          <div class="discover-title">
            发现
          </div>

          <div class="discover-subtitle">
            遇见一个你愿意长期认识的人。
          </div>

        </div>

        <button
          class="search-button"
          type="button"
        >
          ⌕
        </button>

      </div>

      <div class="categories">

        <button
          class="category active"
          type="button"
        >
          推荐
        </button>

        <button
          class="category"
          type="button"
        >
          治愈
        </button>

        <button
          class="category"
          type="button"
        >
          都市
        </button>

        <button
          class="category"
          type="button"
        >
          成熟
        </button>

        <button
          class="category"
          type="button"
        >
          剧情
        </button>

      </div>

    </div>

    <div class="character-grid">

      <button
        class="character-card"
        type="button"
        onclick="openRole('linwan')"
      >

        <div class="character-image linwan">

          <div class="character-initial">
            晚
          </div>

          <div class="image-tags">

            <span class="image-tag">
              慢热
            </span>

            <span class="image-tag">
              克制
            </span>

          </div>

        </div>

        <div class="character-info">

          <div class="character-name">
            林晚
          </div>

          <div class="character-description">
            她不一定会安慰你，但通常知道你什么时候开始不对劲。
          </div>

        </div>

      </button>


      <button
        class="character-card"
        type="button"
        onclick="openRole('sunian')"
      >

        <div class="character-image sunian">

          <div class="character-initial">
            念
          </div>

          <div class="image-tags">

            <span class="image-tag">
              外向
            </span>

            <span class="image-tag">
              爱分享
            </span>

          </div>

        </div>

        <div class="character-info">

          <div class="character-name">
            苏念
          </div>

          <div class="character-description">
            她总有很多小事想告诉你，也很容易记住你的习惯。
          </div>

        </div>

      </button>


      <button
        class="character-card"
        type="button"
        onclick="openRole('chenyu')"
      >

        <div class="character-image chenyu">

          <div class="character-initial">
            屿
          </div>

          <div class="image-tags">

            <span class="image-tag">
              理性
            </span>

            <span class="image-tag">
              嘴硬
            </span>

          </div>

        </div>

        <div class="character-info">

          <div class="character-name">
            陈屿
          </div>

          <div class="character-description">
            你想逃避的时候，他通常比你更早看出来。
          </div>

        </div>

      </button>


      <button
        class="character-card"
        type="button"
        onclick="openRole('shenchuan')"
      >

        <div class="character-image shenchuan">

          <div class="character-initial">
            川
          </div>

          <div class="image-tags">

            <span class="image-tag">
              成熟
            </span>

            <span class="image-tag">
              稳定
            </span>

          </div>

        </div>

        <div class="character-info">

          <div class="character-name">
            沈川
          </div>

          <div class="character-description">
            他不会时时刻刻黏着你，但重要的时候很少缺席。
          </div>

        </div>

      </button>

    </div>

    <div class="preview-note">
      当前人物形象仍为临时占位。
      <br>
      这一阶段重点测试页面结构和聊天体验。
    </div>

  </section>


  <section
    id="conversationScreen"
    class="screen root-screen"
  >

    <div class="section-header">

      <div class="section-title">
        会话
      </div>

      <div class="section-note">
        回到已经认识的TA身边。
      </div>

    </div>

    <div
      id="conversationList"
      class="conversation-list"
    ></div>

  </section>


  <section
    id="myScreen"
    class="screen root-screen"
  >

    <div class="section-header">

      <div class="section-title">
        我的
      </div>

      <div class="section-note">
        账号、会员和个人设置以后都会在这里。
      </div>

    </div>

    <div class="profile-box">

      <div class="profile-status">

    document
      .getElementById('composer')
      .classList.remove('active');

  function showComposer() {

    document
      .getElementById('composer')
      .classList.add('active');

    hideAllScreens();

    document
      .getElementById(screenId)
      .classList.add('active');

    document
      .getElementById('bottomNav')
      .classList.remove('hidden');

    document
      .querySelectorAll('.nav-item')
      .forEach(item => {

      });

    button.classList.add('active');

    if (
      screenId ===
      'conversationScreen'
    ) {

      renderConversations();

    }

    window.scrollTo(0, 0);
  }


  function openRole(key) {

    clearPendingReply();

    currentRoleKey = key;

    document
      .getElementById('roleName')
      .innerText = role.name;

    document
      .getElementById('roleBigInitial')
      .innerText = role.initial;

    document
      .getElementById('roleQuote')
      .innerText = role.quote;

    document
      .getElementById('roleAbout')
      .innerText = role.about;


    const hero =
      document.getElementById('roleHero');

    hero.className =
      'role-hero ' + role.heroClass;


    const tags =
      document.getElementById('roleTags');

    tags.innerHTML = '';


    role.tags.forEach(tag => {

      const item =
        document.createElement('span');

      item.className =
        'role-tag';

      item.innerText =
        tag;

      tags.appendChild(item);

    });


    hideAllScreens();

    hideComposer();

    document
      .getElementById('roleScreen')
      .classList.add('active');

    document
      .getElementById('bottomNav')
      .classList.add('hidden');

    window.scrollTo(0, 0);

      role.chatClass;


    document
      .getElementById('bottomNav')
      .classList.add('hidden');


    if (
      conversationStarted[key]
    ) {

      document
        .getElementById(
          'introActions'
        )
        .classList.add('hidden');

      renderChatHistory();

      showComposer();

    } else {

      introIndex = 0;

      document
        .getElementById(
          'introActions'
        )
        .classList.remove('hidden');

      document
        .getElementById(
          'continueButton'
        )
        .style.display = 'block';

      renderIntro();

      hideComposer();

    }


    window.scrollTo(0, 0);
  }


  function getCurrentTimeText() {

    const now =
      new Date();

    return (
      '今天 · ' +
      String(
        now.getHours()
      ).padStart(2, '0') +
      ':' +
      String(
        now.getMinutes()
      ).padStart(2, '0')
    );
  }


  function renderIntro() {

    const role =
      roles[currentRoleKey];

    const feed =
      document.getElementById(
        'chatFeed'
      );


    feed.innerHTML = '';


    const time =
      document.createElement('div');

    time.className =
      'time-line';

    time.innerText =
      getCurrentTimeText();

    feed.appendChild(time);


    for (
      let i = 0;
      i <= introIndex;
      i++
    ) {

      feed.appendChild(

        createAIEntry(
          role.name,
          role.intro[i]
        )

      );

    }


    if (
      introIndex >=
      role.intro.length - 1
    ) {

      document
        .getElementById(
          'continueButton'
        )
        .style.display = 'none';

    }
  }


  function continueIntro() {

    const role =
      roles[currentRoleKey];


    if (
      introIndex <
      role.intro.length - 1
    ) {

      introIndex++;

    }


    renderIntro();

    scrollToLatest();
  }


  function enterConversation() {

    const role =
      roles[currentRoleKey];


    conversationStarted[
      currentRoleKey
    ] = true;


    if (
      chatHistory[
        currentRoleKey
      ].length === 0
    ) {

      for (
        let i = 0;
        i <= introIndex;
        i++
      ) {

        chatHistory[
          currentRoleKey
        ].push({

          type: 'ai',

          text: role.intro[i],

          time: Date.now()

        });

      }
    }


    document
      .getElementById(
        'introActions'
      )
      .classList.add('hidden');


    renderChatHistory();

    showComposer();


    setTimeout(() => {

      const input =
        document.getElementById(
          'chatInput'
        );

      input.focus();

      scrollToLatest();

    }, 120);
  }


  function finishToday() {

    clearPendingReply();

    const role =
      roles[currentRoleKey];

    const feed =
      document.getElementById(
        'chatFeed'
      );


    feed.innerHTML = '';


    const time =
      document.createElement('div');

    time.className =
      'time-line';

    time.innerText =
      getCurrentTimeText();

    feed.appendChild(time);


    feed.appendChild(

      createAIEntry(

        role.name,

        '好。\\n今天就到这里。\\n下次来的时候，我们再继续。'

      )

    );


    document
      .getElementById(
        'continueButton'
      )
      .style.display = 'none';
  }


  function createAIEntry(
    name,
    text
  ) {

    const wrapper =
      document.createElement('div');

    wrapper.className =
      'ai-entry';


    const speaker =
      document.createElement('div');

    speaker.className =
      'speaker';

    speaker.innerText =
      name;


    const message =
      document.createElement('div');

    message.className =
      'ai-text';

    message.innerText =
      normalizeDisplayText(text);


    wrapper.appendChild(
      speaker
    );

    wrapper.appendChild(
      message
    );


    return wrapper;
  }


  function createUserEntry(text) {

    const wrapper =
      document.createElement('div');

    wrapper.className =
      'user-entry';


    const message =
      document.createElement('div');

    message.className =
      'user-message';

    message.innerText =
      text;


    wrapper.appendChild(
      message
    );


    return wrapper;
  }


  function normalizeDisplayText(text) {

    return String(
      text || ''
    )
      .replace(/\r/g, '')
      .replace(
        /\n{3,}/g,
        '\n\n'
      )
      .replace(
        /[ \t]+\n/g,
        '\n'
      )
      .trim();
  }


  function renderChatHistory() {

    const role =
      roles[currentRoleKey];

    const history =
      chatHistory[
        currentRoleKey
      ];

    const feed =
      document.getElementById(
        'chatFeed'
      );


    feed.innerHTML = '';


    const time =
      document.createElement('div');

    time.className =
      'time-line';

    time.innerText =
      getCurrentTimeText();

    feed.appendChild(time);


    history.forEach(item => {

      if (
        item.type === 'ai'
      ) {

        feed.appendChild(

          createAIEntry(
            role.name,
            item.text
          )

        );

      } else {

        feed.appendChild(

          createUserEntry(
            item.text
          )

        );

      }

    });


    scrollToLatest();
  }


  function sendMessage() {

    const input =
      document.getElementById(
        'chatInput'
      );

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    chatHistory[
      currentRoleKey
    ].push({

      type: 'user',

      text: text,

      time: Date.now()

    });


    input.value = '';


    renderChatHistory();

    scheduleReply();
  }


  function handleInputKey(event) {

    if (
      event.key === 'Enter' &&
      !isComposing
    ) {

      event.preventDefault();

      sendMessage();

    }
  }


  function handleCompositionStart() {

    isComposing = true;
  }


  function handleCompositionEnd() {

    isComposing = false;
  }


  function scheduleReply() {

    clearTimeout(
      pendingReplyTimer
    );


    const generation =
      ++replyGeneration;


    renderChatHistory();

    showTyping();


    const delay =
      850 +
      Math.floor(
        Math.random() * 550
      );


    pendingReplyTimer =
      setTimeout(() => {

        if (
          generation !==
          replyGeneration
        ) {
          return;
        }

        fakeReply();

        pendingReplyTimer =
          null;

      }, delay);
  }


  function clearPendingReply() {

    if (
      pendingReplyTimer
    ) {

      clearTimeout(
        pendingReplyTimer
      );

      pendingReplyTimer =
        null;
    }

    replyGeneration++;
  }


  function showTyping() {

    const role =
      roles[currentRoleKey];

    const feed =
      document.getElementById(
        'chatFeed'
      );


    const oldTyping =
      document.getElementById(
        'typing'
      );


    if (oldTyping) {
      oldTyping.remove();
    }


    const typing =
      document.createElement('div');

    typing.id =
      'typing';

    typing.className =
      'typing';

    typing.innerText =
      role.name +
      '正在想……';


    feed.appendChild(
      typing
    );


    scrollToLatest();
  }


  function fakeReply() {

    const roleKey =
      currentRoleKey;


    const userMessages =
      getRecentUserBatch(
        roleKey
      );


    const combinedText =
      userMessages
        .map(
          item => item.text
        )
        .join('；');


    const intent =
      detectIntent(
        combinedText
      );


    const reply =
      pickResponse(
        intent,
        roleKey
      );


    chatHistory[
      roleKey
    ].push({

      type: 'ai',

      text: reply,

      time: Date.now()

    });


    renderChatHistory();
  }


  function getRecentUserBatch(
    roleKey
  ) {

    const history =
      chatHistory[
        roleKey
      ];

    const batch = [];


    for (
      let i =
        history.length - 1;
      i >= 0;
      i--
    ) {

      const item =
        history[i];


      if (
        item.type === 'ai'
      ) {
        break;
      }


      if (
        item.type === 'user'
      ) {

        batch.unshift(
          item
        );

      }

    }


    return batch;
  }


  function detectIntent(
    rawText
  ) {

    const text =
      String(
        rawText || ''
      )
        .toLowerCase()
        .trim();


    if (
      /不想活了|想死|自杀|伤害自己|结束生命/.test(text)
    ) {
      return 'crisis';
    }


    if (
      /你是不是ai|你是ai吗|你是真人吗|你是机器人吗/.test(text)
    ) {
      return 'identity';
    }


    if (
      /不想说|不想聊|别问了|不想讲/.test(text)
    ) {
      return 'silence';
    }


    if (
      /睡了|睡觉|晚安|困了|去睡|休息了/.test(text)
    ) {
      return 'sleep';
    }


    if (
      /再见|拜拜|先走了|我走了|下次聊/.test(text)
    ) {
      return 'leave';
    }


    if (
      /你记得我吗|还记得我吗|记得我|记不记得/.test(text)
    ) {
      return 'memory';
    }


    if (
      /谢谢|谢了|多谢|感谢/.test(text)
    ) {
      return 'thanks';
    }


    if (
      /滚|闭嘴|烦死你|讨厌你|烦人|你烦不烦|你真烦|傻逼|有病|神经病/.test(text)
    ) {
      return 'angry';
    }


    if (
      /想解决你|解决你|收拾你|搞定你/.test(text)
    ) {
      return 'playful';
    }


    if (
      /喜欢你|爱你|想你了|想你|喜欢上你/.test(text)
    ) {
      return 'affection';
    }


    if (
      /累|烦|难受|不开心|心情不好|压力大|崩溃/.test(text)
    ) {
      return 'tired';
    }


    if (
      /产品|工作|上班|创业|项目|做不下去|放弃|代码|开发/.test(text)
    ) {
      return 'work';
    }


    if (
      /你好|嗨|哈喽|hello|在吗|在不在/.test(text)
    ) {
      return 'greeting';
    }


    const compact =
      text.replace(
        /\s+/g,
        ''
      );


    if (
      compact.length <= 3
    ) {

      return 'short';

    }


    return 'default';
  }


  function pickResponse(
    intent,
    roleKey
  ) {

    const bank =
      responseBanks[intent] ||
      responseBanks.default;


    const options =
      bank[roleKey] ||
      responseBanks.default[
        roleKey
      ] ||
      ['嗯。'];


    const cursorKey =
      intent +
      ':' +
      roleKey;


    const cursor =
      responseCursor[
        cursorKey
      ] || 0;


    responseCursor[
      cursorKey
    ] =
      cursor + 1;


    return options[
      cursor %
      options.length
    ];
  }


  function scrollToLatest() {

    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        window.scrollTo({

          top:
            document
              .documentElement
              .scrollHeight,

          behavior:
            'smooth'

        });

      });

    });
  }


  function backToConversation() {

    clearPendingReply();

    hideAllScreens();

    hideComposer();

    document
      .getElementById(
        'conversationScreen'
      )
      .classList.add('active');

    document
      .getElementById(
        'bottomNav'
      )
      .classList.remove('hidden');

    renderConversations();

    setActiveNav(1);

    window.scrollTo(0, 0);
  }


  function renderConversations() {

    const list =
      document.getElementById(
        'conversationList'
      );


    list.innerHTML = '';


    knownRoles.forEach(key => {

      const role =
        roles[key];

      const history =
        chatHistory[key];


      let preview =
        role.intro[0]
          .replace(
            /\n/g,
            ' '
          );


      if (
        history.length > 0
      ) {

        preview =
          history[
            history.length - 1
          ]
            .text
            .replace(
              /\n/g,
              ' '
            );

      }


      const button =
        document.createElement(
          'button'
        );


      button.className =
        'conversation-card';

      button.type =
        'button';

      button.onclick =
        function() {

          openChat(key);

        };


      const avatar =
        document.createElement(
          'div'
        );

      avatar.className =
        'conversation-avatar';

      avatar.innerText =
        role.initial;


      const main =
        document.createElement(
          'div'
        );

      main.className =
        'conversation-main';


      const name =
        document.createElement(
          'div'
        );

      name.className =
        'conversation-name';

      name.innerText =
        role.name;


      const previewEl =
        document.createElement(
          'div'
        );

      previewEl.className =
        'conversation-preview';

      previewEl.innerText =
        preview;


      const time =
        document.createElement(
          'div'
        );

      time.className =
        'conversation-time';

      time.innerText =
        '今天';


      main.appendChild(
        name
      );

      main.appendChild(
        previewEl
      );


      button.appendChild(
        avatar
      );

      button.appendChild(
        main
      );

      button.appendChild(
        time
      );


      list.appendChild(
        button
      );

    });
  }


  function openMemory() {

    clearPendingReply();

    const role =
      roles[currentRoleKey];


    document
      .getElementById(
        'memoryTitle'
      )
      .innerText =
        role.name +
        '记得';


    renderMemory(role);

    hideAllScreens();

    hideComposer();

    document
      .getElementById(
        'memoryScreen'
      )
      .classList.add('active');

    document
      .getElementById(
        'bottomNav'
      )
      .classList.add('hidden');

    window.scrollTo(0, 0);
  }


  function renderMemory(role) {

    const container =
      document.getElementById(
        'memoryContent'
      );


    container.innerHTML = '';


    container.appendChild(

      createMemorySection(
        '关于你',
        role.memory.about,
        '关于你'
      )

    );


    container.appendChild(

      createMemorySection(
        '共同经历',
        role.memory.events,
        '共同经历'
      )

    );


    container.appendChild(

      createMemorySection(
        'TA对你的理解',
        role.memory.understanding,
        '关系理解'
      )

    );
  }


  function createMemorySection(
    title,
    items,
    meta
  ) {

    const wrapper =
      document.createElement('div');


    const heading =
      document.createElement('div');

    heading.className =
      'memory-section-title';

    heading.innerText =
      title;


    wrapper.appendChild(
      heading
    );


    const card =
      document.createElement('div');

    card.className =
      'memory-card';


    if (
      items.length === 0
    ) {

      const empty =
        document.createElement(
          'div'
        );

      empty.className =
        'empty-memory';

      empty.innerText =
        '你们还没有留下足够多的共同信息。';


      card.appendChild(
        empty
      );

    } else {

      items.forEach(text => {

        const item =
          document.createElement(
            'div'
          );

        item.className =
          'memory-item';


        const memoryText =
          document.createElement(
            'div'
          );

        memoryText.className =
          'memory-text';

        memoryText.innerText =
          text;


        const memoryMeta =
          document.createElement(
            'div'
          );

        memoryMeta.className =
          'memory-meta';

        memoryMeta.innerText =
          meta +
          ' · 测试数据';


        item.appendChild(
          memoryText
        );

        item.appendChild(
          memoryMeta
        );


        card.appendChild(
          item
        );

      });
    }


    wrapper.appendChild(
      card
    );


    return wrapper;
  }


  function backToChat() {

    openChat(
      currentRoleKey
    );
  }


  function setActiveNav(index) {

    document
      .querySelectorAll(
        '.nav-item'
      )
      .forEach(
        (
          item,
          itemIndex
        ) => {

          item.classList.toggle(
            'active',
            itemIndex === index
          );

        }
      );
  }


  renderConversations();

</script>

</body>
</html>
