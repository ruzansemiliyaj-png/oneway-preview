<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Companion Preview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #111318;
      color: #ffffff;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #111318;
    }

    .screen {
      display: none;
      min-height: 100vh;
    }

    .screen.active {
      display: block;
    }

    .root-screen {
      padding: 0 18px 100px;
    }

    .back-button {
      border: 0;
      background: transparent;
      padding: 8px 8px 8px 0;
      font-size: 28px;
      color: inherit;
    }

    /* =========================
       发现
    ========================= */

    .discover-header {
      padding-top: 28px;
    }

    .discover-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .discover-title {
      font-size: 30px;
      font-weight: 780;
      letter-spacing: -1px;
    }

    .discover-subtitle {
      margin-top: 8px;
      color: #7f8590;
      font-size: 13px;
    }

    .search-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 14px;
      background: #1c1f26;
      color: #d2d5dc;
      font-size: 20px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin: 24px -18px 20px;
      padding: 0 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 0;
      padding: 9px 15px;
      border-radius: 20px;
      background: #1a1d23;
      color: #8d939e;
      font-size: 13px;
    }

    .category.active {
      background: white;
      color: #17191e;
      font-weight: 650;
    }

    .character-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .character-card {
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      background: #1a1d23;
      color: white;
      text-align: left;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    .character-image {
      position: relative;
      height: 218px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
    }

    .character-image::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 55%;
      background: linear-gradient(
        to top,
        rgba(15,16,20,.86),
        rgba(15,16,20,0)
      );
    }

    .character-initial {
      position: relative;
      z-index: 1;
      margin-bottom: 43px;
      font-size: 58px;
      font-weight: 800;
      color: rgba(255,255,255,.86);
      text-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    .linwan {
      background:
        radial-gradient(circle at 72% 20%, #93a0b1, transparent 32%),
        linear-gradient(145deg, #485462, #262b35 65%, #17191f);
    }

    .sunian {
      background:
        radial-gradient(circle at 25% 20%, #e1b29a, transparent 35%),
        linear-gradient(145deg, #bd8778, #704f59 60%, #28212a);
    }

    .chenyu {
      background:
        radial-gradient(circle at 75% 18%, #6c7d8f, transparent 34%),
        linear-gradient(145deg, #424d5a, #242a33 62%, #17191d);
    }

    .shenchuan {
      background:
        radial-gradient(circle at 30% 20%, #748b9d, transparent 34%),
        linear-gradient(145deg, #364c60, #202d3a 62%, #14191f);
    }

    .image-tags {
      position: absolute;
      z-index: 2;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .image-tag {
      padding: 5px 8px;
      border-radius: 9px;
      background: rgba(20,22,27,.72);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: #e6e8ec;
      font-size: 10px;
    }

    .character-info {
      padding: 14px 14px 16px;
    }

    .character-name {
      font-size: 17px;
      font-weight: 730;
    }

    .character-description {
      height: 41px;
      margin-top: 7px;
      overflow: hidden;
      color: #9399a4;
      font-size: 12px;
      line-height: 1.65;
    }

    .preview-note {
      margin-top: 22px;
      color: #656b75;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    /* =========================
       会话 / 我的
    ========================= */

    .section-header {
      padding-top: 30px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 29px;
      font-weight: 760;
    }

    .section-note {
      margin-top: 7px;
      color: #7f8590;
      font-size: 13px;
    }

    .conversation-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .conversation-card {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: #1a1d23;
      color: white;
      display: flex;
      align-items: center;
      text-align: left;
    }

    .conversation-avatar {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 18px;
      background: linear-gradient(145deg, #687584, #303741);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .conversation-main {
      flex: 1;
      min-width: 0;
      margin-left: 13px;
    }

    .conversation-name {
      font-size: 16px;
      font-weight: 680;
    }

    .conversation-preview {
      margin-top: 6px;
      overflow: hidden;
      color: #8e949f;
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .conversation-time {
      margin-left: 8px;
      color: #666c76;
      font-size: 10px;
    }

    .profile-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 22px;
      background: #1a1d23;
    }

    .profile-status {
      font-size: 18px;
      font-weight: 680;
    }

    .profile-description {
      margin-top: 7px;
      color: #838995;
      font-size: 12px;
      line-height: 1.7;
    }

    .login-placeholder {
      width: 100%;
      height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 16px;
      background: white;
      color: #15171c;
      font-weight: 650;
    }

    .settings-list {
      margin-top: 20px;
      overflow: hidden;
      border-radius: 20px;
      background: #1a1d23;
    }

    .settings-row {
      min-height: 58px;
      padding: 0 17px;
      border-bottom: 1px solid #252830;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d9dce2;
      font-size: 14px;
    }

    .settings-row:last-child {
      border-bottom: 0;
    }

    .settings-value {
      color: #707680;
      font-size: 12px;
    }

    /* =========================
       角色详情
    ========================= */

    .role-detail-screen {
      padding-bottom: 40px;
      background: #101216;
      color: white;
    }

    .role-detail-top {
      padding: 18px 20px 0;
    }

    .role-hero {
      position: relative;
      height: 47vh;
      min-height: 340px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .role-big-initial {
      font-size: 100px;
      font-weight: 800;
      color: rgba(255,255,255,.78);
    }

    .role-content {
      padding: 25px 22px;
    }

    .role-name {
      font-size: 29px;
      font-weight: 780;
    }

    .role-tags {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .role-tag {
      padding: 6px 9px;
      border-radius: 10px;
      background: #1d2026;
      color: #aeb3bc;
      font-size: 11px;
    }

    .role-quote {
      margin-top: 26px;
      color: #e7e8eb;
      font-size: 18px;
      line-height: 1.75;
    }

    .role-about {
      margin-top: 18px;
      color: #858b95;
      font-size: 13px;
      line-height: 1.75;
    }

    .meet-button {
      width: 100%;
      height: 55px;
      margin-top: 28px;
      border: 0;
      border-radius: 18px;
      background: white;
      color: #15171b;
      font-size: 16px;
      font-weight: 700;
    }

    /* =========================
       A + C 聊天页
    ========================= */

    .chat-screen {
      position: relative;
      min-height: 100vh;
      padding: 18px 20px 145px;
      overflow: hidden;
      color: #242b32;
      background: #dce3e8;
    }

    .chat-screen::before,
    .chat-screen::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(1px);
      opacity: .55;
    }

    .chat-screen::before {
      width: 320px;
      height: 320px;
      top: 80px;
      right: -140px;
      background: rgba(255,255,255,.5);
    }

    .chat-screen::after {
      width: 280px;
      height: 280px;
      left: -130px;
      bottom: 70px;
      background: rgba(101,125,145,.18);
    }

    .chat-linwan {
      background:
        radial-gradient(circle at 78% 16%, rgba(255,255,255,.74), transparent 30%),
        radial-gradient(circle at 15% 72%, rgba(104,127,145,.16), transparent 38%),
        linear-gradient(165deg, #eef2f4 0%, #d7e0e6 52%, #c3d0d8 100%);
    }

    .chat-sunian {
      background:
        radial-gradient(circle at 20% 15%, rgba(255,244,225,.85), transparent 31%),
        radial-gradient(circle at 85% 75%, rgba(189,122,106,.17), transparent 37%),
        linear-gradient(165deg, #f8eee5 0%, #f0d8c9 55%, #dfbdaf 100%);
    }

    .chat-chenyu {
      background:
        radial-gradient(circle at 78% 15%, rgba(255,255,255,.58), transparent 28%),
        radial-gradient(circle at 13% 72%, rgba(75,91,105,.17), transparent 38%),
        linear-gradient(165deg, #e8ecef 0%, #ced6dc 55%, #b6c0c8 100%);
    }

    .chat-shenchuan {
      background:
        radial-gradient(circle at 75% 15%, rgba(235,242,246,.58), transparent 28%),
        radial-gradient(circle at 15% 72%, rgba(55,78,96,.19), transparent 38%),
        linear-gradient(165deg, #dde5e9 0%, #c2d0d8 53%, #9fb2be 100%);
    }

    .chat-header {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: rgba(78,94,108,.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(55,70,82,.15);
    }

    .chat-name {
      font-size: 18px;
      font-weight: 730;
    }

    .chat-status {
      margin-top: 3px;
      color: rgba(45,57,67,.55);
      font-size: 11px;
    }

    .memory-link {
      border: 0;
      background: transparent;
      color: rgba(45,57,67,.6);
      font-size: 12px;
    }

    .chat-feed {
      position: relative;
      z-index: 3;
      padding: 58px 5px 25px;
    }

    .time-line {
      margin: 0 0 26px;
      color: rgba(42,53,62,.42);
      font-size: 11px;
    }

    .ai-entry {
      max-width: 92%;
      margin-bottom: 34px;
    }

    .speaker {
      margin-bottom: 9px;
      color: rgba(45,56,65,.55);
      font-size: 11px;
      font-weight: 650;
    }

    .ai-text {
      color: #273039;
      font-size: 20px;
      line-height: 1.8;
      white-space: pre-line;
      letter-spacing: .1px;
    }

    .user-entry {
      display: flex;
      justify-content: flex-end;
      margin: 5px 0 33px;
    }

    .user-message {
      max-width: 82%;
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 17px 17px 5px 17px;
      background: rgba(255,255,255,.38);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #303940;
      font-size: 15px;
      line-height: 1.6;
      box-shadow: 0 8px 25px rgba(66,82,95,.06);
    }

    .typing {
      margin-bottom: 28px;
      color: rgba(44,57,67,.48);
      font-size: 12px;
    }

    .intro-actions {
      position: relative;
      z-index: 5;
      margin-top: 3px;
    }

    .intro-actions.hidden {
      display: none;
    }

    .continue-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 18px;
      background: rgba(37,48,57,.9);
      color: white;
      font-size: 15px;
      font-weight: 650;
      box-shadow: 0 12px 30px rgba(53,67,79,.15);
    }

    .talk-button {
      width: 100%;
      height: 48px;
      margin-top: 9px;
      border: 1px solid rgba(60,76,88,.13);
      border-radius: 18px;
      background: rgba(255,255,255,.34);
      color: #3b4852;
      font-size: 14px;
      font-weight: 600;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .finish-button {
      width: 100%;
      padding: 16px 10px 4px;
      border: 0;
      background: transparent;
      color: rgba(52,65,75,.48);
      font-size: 12px;
    }

    .composer {
      display: none;
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(70,84,95,.08);
      background: rgba(230,237,241,.74);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
    }

    .composer.active {
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      height: 48px;
      min-width: 0;
      padding: 0 16px;
      border: 1px solid rgba(72,87,99,.09);
      outline: none;
      border-radius: 18px;
      background: rgba(255,255,255,.58);
      color: #28333c;
      font-size: 15px;
      box-shadow: 0 7px 20px rgba(61,77,89,.05);
    }

    .chat-input::placeholder {
      color: rgba(49,63,73,.38);
    }

    .send-button {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 17px;
      background: #34434e;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    /* =========================
       记忆
    ========================= */

    .memory-screen {
      padding: 20px 20px 50px;
      background: #f4f6f7;
      color: #20262c;
    }

    .memory-title {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 760;
    }

    .memory-subtitle {
      margin-top: 8px;
      margin-bottom: 30px;
      color: #9298a0;
      font-size: 13px;
      line-height: 1.65;
    }

    .memory-section-title {
      margin: 27px 4px 10px;
      color: #9298a0;
      font-size: 12px;
    }

    .memory-card {
      overflow: hidden;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 30px rgba(25,35,50,.04);
    }

    .memory-item {
      padding: 18px;
      border-bottom: 1px solid #f0f1f3;
    }

    .memory-item:last-child {
      border-bottom: 0;
    }

    .memory-text {
      font-size: 14px;
      line-height: 1.68;
    }

    .memory-meta {
      margin-top: 7px;
      color: #a2a6ad;
      font-size: 10px;
    }

    .empty-memory {
      padding: 20px 18px;
      color: #9aa0a8;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       底栏
    ========================= */

    .nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 79px;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid rgba(255,255,255,.05);
      background: rgba(17,19,24,.94);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .nav.hidden {
      display: none;
    }

    .nav-item {
      min-width: 90px;
      height: 52px;
      border: 0;
      background: transparent;
      color: #676d77;
      font-size: 13px;
    }

    .nav-item.active {
      color: white;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 发现 -->
  <section id="discoverScreen" class="screen root-screen active">

    <div class="discover-header">

      <div class="discover-top">
        <div>
          <div class="discover-title">发现</div>
          <div class="discover-subtitle">
            遇见一个你愿意长期认识的人。
          </div>
        </div>

        <button class="search-button">⌕</button>
      </div>

      <div class="categories">
        <button class="category active">推荐</button>
        <button class="category">治愈</button>
        <button class="category">都市</button>
        <button class="category">成熟</button>
        <button class="category">剧情</button>
      </div>

    </div>

    <div class="character-grid">

      <button class="character-card" onclick="openRole('linwan')">
        <div class="character-image linwan">
          <div class="character-initial">晚</div>

          <div class="image-tags">
            <span class="image-tag">慢热</span>
            <span class="image-tag">克制</span>
          </div>
        </div>

        <div class="character-info">
          <div class="character-name">林晚</div>
          <div class="character-description">
            她不一定会安慰你，但通常知道你什么时候开始不对劲。
          </div>
        </div>
      </button>


      <button class="character-card" onclick="openRole('sunian')">
        <div class="character-image sunian">
          <div class="character-initial">念</div>

          <div class="image-tags">
            <span class="image-tag">外向</span>
            <span class="image-tag">爱分享</span>
          </div>
        </div>

        <div class="character-info">
          <div class="character-name">苏念</div>
          <div class="character-description">
            她总有很多小事想告诉你，也很容易记住你的习惯。
          </div>
        </div>
      </button>


      <button class="character-card" onclick="openRole('chenyu')">
        <div class="character-image chenyu">
          <div class="character-initial">屿</div>

          <div class="image-tags">
            <span class="image-tag">理性</span>
            <span class="image-tag">嘴硬</span>
          </div>
        </div>

        <div class="character-info">
          <div class="character-name">陈屿</div>
          <div class="character-description">
            你想逃避的时候，他通常比你更早看出来。
          </div>
        </div>
      </button>


      <button class="character-card" onclick="openRole('shenchuan')">
        <div class="character-image shenchuan">
          <div class="character-initial">川</div>

          <div class="image-tags">
            <span class="image-tag">成熟</span>
            <span class="image-tag">稳定</span>
          </div>
        </div>

        <div class="character-info">
          <div class="character-name">沈川</div>
          <div class="character-description">
            他不会时时刻刻黏着你，但重要的时候很少缺席。
          </div>
        </div>
      </button>

    </div>

    <div class="preview-note">
      当前人物形象仍为临时占位。<br>
      这一阶段重点测试页面结构和聊天体验。
    </div>

  </section>


  <!-- 会话 -->
  <section id="conversationScreen" class="screen root-screen">

    <div class="section-header">
      <div class="section-title">会话</div>
      <div class="section-note">
        回到已经认识的TA身边。
      </div>
    </div>

    <div id="conversationList" class="conversation-list"></div>

  </section>


  <!-- 我的 -->
  <section id="myScreen" class="screen root-screen">

    <div class="section-header">
      <div class="section-title">我的</div>
      <div class="section-note">
        账号、会员和个人设置以后都会在这里。
      </div>
    </div>

    <div class="profile-box">
      <div class="profile-status">当前：预览模式</div>

      <div class="profile-description">
        现在还没有接入真实登录。
        正式版本登录后，会保存你的会话、角色关系和长期记忆。
      </div>

      <button class="login-placeholder">
        登录 · 后续接入
      </button>
    </div>

    <div class="settings-list">

      <div class="settings-row">
        <span>收藏角色</span>
        <span class="settings-value">›</span>
      </div>

      <div class="settings-row">
        <span>记忆与数据</span>
        <span class="settings-value">›</span>
      </div>

      <div class="settings-row">
        <span>隐私设置</span>
        <span class="settings-value">›</span>
      </div>

      <div class="settings-row">
        <span>帮助与反馈</span>
        <span class="settings-value">›</span>
      </div>

    </div>

  </section>


  <!-- 角色详情 -->
  <section id="roleScreen" class="screen role-detail-screen">

    <div class="role-detail-top">

      <button class="back-button" onclick="backToDiscover()">
        ‹
      </button>

      <div id="roleHero" class="role-hero linwan">
        <div id="roleBigInitial" class="role-big-initial">
          晚
        </div>
      </div>

    </div>

    <div class="role-content">

      <div id="roleName" class="role-name">
        林晚
      </div>

      <div id="roleTags" class="role-tags"></div>

      <div id="roleQuote" class="role-quote"></div>

      <div id="roleAbout" class="role-about"></div>

      <button class="meet-button" onclick="startCurrentRole()">
        认识TA
      </button>

      <div class="preview-note">
        预览阶段暂时跳过登录流程。
      </div>

    </div>

  </section>


  <!-- A + C 聊天 -->
  <section id="chatScreen" class="screen chat-screen chat-linwan">

    <div class="chat-header">

      <div class="chat-header-left">

        <button class="back-button" onclick="backToConversation()">
          ‹
        </button>

        <div id="chatAvatar" class="chat-avatar">
          晚
        </div>

        <div>
          <div id="chatName" class="chat-name">
            林晚
          </div>

          <div class="chat-status">
            今天 · 在这里
          </div>
        </div>

      </div>

      <button class="memory-link" onclick="openMemory()">
        记忆
      </button>

    </div>


    <div id="chatFeed" class="chat-feed"></div>


    <div id="introActions" class="intro-actions">

      <button
        id="continueButton"
        class="continue-button"
        onclick="continueIntro()"
      >
        继续听TA说
      </button>

      <button
        id="talkButton"
        class="talk-button"
        onclick="enterConversation()"
      >
        我想和TA说句话
      </button>

      <button
        class="finish-button"
        onclick="finishToday()"
      >
        今天先到这里
      </button>

    </div>

  </section>


  <!-- 输入区 -->
  <div id="composer" class="composer">

    <input
      id="chatInput"
      class="chat-input"
      type="text"
      placeholder="说点什么……"
      autocomplete="off"
      onkeydown="handleInputKey(event)"
    >

    <button class="send-button" onclick="sendMessage()">
      ↑
    </button>

  </div>


  <!-- 记忆 -->
  <section id="memoryScreen" class="screen memory-screen">

    <button class="back-button" onclick="backToChat()">
      ‹
    </button>

    <div id="memoryTitle" class="memory-title">
      林晚记得
    </div>

    <div class="memory-subtitle">
      这些不是普通聊天记录，
      而是TA在相处过程中留下的重要理解。
    </div>

    <div id="memoryContent"></div>

  </section>

</div>


<!-- 底部导航 -->
<nav id="bottomNav" class="nav">

  <button
    class="nav-item active"
    onclick="showRoot('discoverScreen', this)"
  >
    发现
  </button>

  <button
    class="nav-item"
    onclick="showRoot('conversationScreen', this)"
  >
    会话
  </button>

  <button
    class="nav-item"
    onclick="showRoot('myScreen', this)"
  >
    我的
  </button>

</nav>


<script>

  const roles = {

    linwan: {
      name: '林晚',
      initial: '晚',
      heroClass: 'linwan',
      chatClass: 'chat-linwan',

      tags: [
        '慢热',
        '克制',
        '观察力强'
      ],

      quote:
        '“我不一定会顺着你，但你说过的话，我会记得。”',

      about:
        '她很少急着给出答案。相比不停安慰，她更习惯先观察一个人真正发生了什么。',

      intro: [
        `回来了？

你昨天说，
今天想把那件事继续做下去。

后来怎么样？`,

        `我记得你第一次说起它的时候，
其实还有点不确定。

但你最后还是开始做了。`,

        `所以今天不用一次解决所有问题。

至少把下一步做完。`
      ],

      replies: [
        `嗯，我在听。

你可以慢一点说。`,

        `我记住了。

不过我更想知道，
这件事真正让你在意的是什么。`,

        `你刚才这句话，
和你之前说过的有一点不一样。`,

        `不用急着给自己一个结论。

先把现在真正发生的事情说清楚。`
      ],

      memory: {
        about: [
          '你正在认真做自己的第一个产品。',
          '你不喜欢别人一直催你，更希望自己想清楚以后行动。'
        ],

        events: [
          '你决定认真把 AI 伴侣这个想法做成真正的产品。',
          '你第一次做出了可以直接在手机上打开的产品原型。'
        ],

        understanding: [
          '她觉得你做决定以前会想很多，但真正开始以后通常会继续推进。'
        ]
      }
    },


    sunian: {
      name: '苏念',
      initial: '念',
      heroClass: 'sunian',
      chatClass: 'chat-sunian',

      tags: [
        '外向',
        '爱分享',
        '有点话多'
      ],

      quote:
        '“我看到一点小事，就会忍不住想回来告诉你。”',

      about:
        '她很容易把自己的生活分享出来。相处久了，也会慢慢记住你的日常习惯。',

      intro: [
        `你来了。

我刚刚还在想，
今天是不是又会碰见你。`,

        `其实没有什么大事。

就是突然有点想找个人说说话。`,

        `反正你在的话，
我就先不走了。`
      ],

      replies: [
        `等等，这个我想听。

你继续说。`,

        `原来是这样。

难怪你刚刚说话的感觉有点不一样。`,

        `那我先记下来。

以后你别说我忘了。`,

        `我突然有点好奇。

如果重新来一次，你还会这么选吗？`
      ],

      memory: {
        about: [],
        events: [],
        understanding: []
      }
    },


    chenyu: {
      name: '陈屿',
      initial: '屿',
      heroClass: 'chenyu',
      chatClass: 'chat-chenyu',

      tags: [
        '理性',
        '嘴硬',
        '行动派'
      ],

      quote:
        '“可以难受，但别拿难受当作什么都不做的理由。”',

      about:
        '他不太擅长漂亮话，也不会为了让你开心就一直顺着你。',

      intro: [
        `终于来了。

昨天那个问题，
你不会到现在还没动吧？`,

        `先别解释。

你自己应该比我更清楚，
到底卡在哪里。`,

        `想清楚了就做。

剩下的以后再说。`
      ],

      replies: [
        `说重点。

你现在真正想解决的是什么？`,

        `这个理由我听懂了。

但它不能代替行动。`,

        `可以。

至少这次你没有躲。`,

        `先做最小的一步。

其他问题做完再讨论。`
      ],

      memory: {
        about: [],
        events: [],
        understanding: []
      }
    },


    shenchuan: {
      name: '沈川',
      initial: '川',
      heroClass: 'shenchuan',
      chatClass: 'chat-shenchuan',

      tags: [
        '成熟',
        '稳定',
        '有边界'
      ],

      quote:
        '“不用每天证明什么。重要的时候，你知道我在就够了。”',

      about:
        '他不会一直追问你，也不会要求你时时回应，但会认真对待真正重要的事情。',

      intro: [
        `晚上好。

今天过得还可以吗？`,

        `不想说也没关系。

有些事情等你想说的时候再说。`,

        `今晚先好好休息。

明天的事，明天处理。`
      ],

      replies: [
        `我明白。

你不用一次把所有事情说完。`,

        `这件事先放在这里也可以。

等你想清楚，我们再继续。`,

        `听起来你已经撑了一段时间了。`,

        `先处理眼前最重要的。

其他事情不用今晚全部解决。`
      ],

      memory: {
        about: [],
        events: [],
        understanding: []
      }
    }

  };


  let currentRoleKey = 'linwan';

  let introIndex = 0;

  let knownRoles = ['linwan'];

  const conversationStarted = {
    linwan: false,
    sunian: false,
    chenyu: false,
    shenchuan: false
  };

  const chatHistory = {
    linwan: [],
    sunian: [],
    chenyu: [],
    shenchuan: []
  };

  const replyIndex = {
    linwan: 0,
    sunian: 0,
    chenyu: 0,
    shenchuan: 0
  };


  function hideAllScreens() {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.remove('active');
    });
  }


  function hideComposer() {
    document.getElementById('composer').classList.remove('active');
  }


  function showComposer() {
    document.getElementById('composer').classList.add('active');
  }


  function showRoot(screenId, button) {

    hideAllScreens();
    hideComposer();

    document.getElementById(screenId).classList.add('active');
    document.getElementById('bottomNav').classList.remove('hidden');

    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
    });

    button.classList.add('active');

    if (screenId === 'conversationScreen') {
      renderConversations();
    }

    window.scrollTo(0, 0);
  }


  function openRole(key) {

    currentRoleKey = key;

    const role = roles[key];

    document.getElementById('roleName').innerText = role.name;
    document.getElementById('roleBigInitial').innerText = role.initial;
    document.getElementById('roleQuote').innerText = role.quote;
    document.getElementById('roleAbout').innerText = role.about;

    const hero = document.getElementById('roleHero');
    hero.className = 'role-hero ' + role.heroClass;

    const tags = document.getElementById('roleTags');

    tags.innerHTML = '';

    role.tags.forEach(tag => {
      const item = document.createElement('span');

      item.className = 'role-tag';
      item.innerText = tag;

      tags.appendChild(item);
    });

    hideAllScreens();
    hideComposer();

    document.getElementById('roleScreen').classList.add('active');
    document.getElementById('bottomNav').classList.add('hidden');

    window.scrollTo(0, 0);
  }


  function backToDiscover() {

    hideAllScreens();
    hideComposer();

    document.getElementById('discoverScreen').classList.add('active');
    document.getElementById('bottomNav').classList.remove('hidden');

    setActiveNav(0);

    window.scrollTo(0, 0);
  }


  function startCurrentRole() {

    if (!knownRoles.includes(currentRoleKey)) {
      knownRoles.push(currentRoleKey);
    }

    openChat(currentRoleKey);
  }


  function openChat(key) {

    currentRoleKey = key;

    const role = roles[key];

    document.getElementById('chatName').innerText = role.name;
    document.getElementById('chatAvatar').innerText = role.initial;

    const chatScreen = document.getElementById('chatScreen');

    chatScreen.className =
      'screen chat-screen active ' + role.chatClass;

    hideAllScreens();

    chatScreen.className =
      'screen chat-screen active ' + role.chatClass;

    document.getElementById('bottomNav').classList.add('hidden');

    if (conversationStarted[key]) {

      document.getElementById('introActions').classList.add('hidden');

      renderChatHistory();

      showComposer();

    } else {

      introIndex = 0;

      document.getElementById('introActions').classList.remove('hidden');

      document.getElementById('continueButton').style.display = 'block';
      document.getElementById('continueButton').innerText = '继续听TA说';

      renderIntro();

      hideComposer();
    }

    window.scrollTo(0, 0);
  }


  function renderIntro() {

    const role = roles[currentRoleKey];
    const feed = document.getElementById('chatFeed');

    feed.innerHTML = '';

    const time = document.createElement('div');

    time.className = 'time-line';
    time.innerText = '今天 · 21:03';

    feed.appendChild(time);

    for (let i = 0; i <= introIndex; i++) {

      const entry = createAIEntry(
        role.name,
        role.intro[i]
      );

      feed.appendChild(entry);
    }

    if (introIndex >= role.intro.length - 1) {
      document.getElementById('continueButton').style.display = 'none';
    }
  }


  function continueIntro() {

    const role = roles[currentRoleKey];

    if (introIndex < role.intro.length - 1) {
      introIndex++;
    }

    renderIntro();

    setTimeout(() => {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }, 80);
  }


  function enterConversation() {

    const role = roles[currentRoleKey];

    conversationStarted[currentRoleKey] = true;

    if (chatHistory[currentRoleKey].length === 0) {

      for (let i = 0; i <= introIndex; i++) {

        chatHistory[currentRoleKey].push({
          type: 'ai',
          text: role.intro[i]
        });
      }
    }

    document.getElementById('introActions').classList.add('hidden');

    renderChatHistory();

    showComposer();

    setTimeout(() => {
      document.getElementById('chatInput').focus();
    }, 180);
  }


  function finishToday() {

    const role = roles[currentRoleKey];
    const feed = document.getElementById('chatFeed');

    feed.innerHTML = '';

    const time = document.createElement('div');

    time.className = 'time-line';
    time.innerText = '今天';

    feed.appendChild(time);

    feed.appendChild(
      createAIEntry(
        role.name,
        `好。

今天就到这里。

下次来的时候，
我们再继续。`
      )
    );

    document.getElementById('continueButton').style.display = 'none';
  }


  function createAIEntry(name, text) {

    const wrapper = document.createElement('div');

    wrapper.className = 'ai-entry';

    const speaker = document.createElement('div');

    speaker.className = 'speaker';
    speaker.innerText = name;

    const message = document.createElement('div');

    message.className = 'ai-text';
    message.innerText = text;

    wrapper.appendChild(speaker);
    wrapper.appendChild(message);

    return wrapper;
  }


  function createUserEntry(text) {

    const wrapper = document.createElement('div');

    wrapper.className = 'user-entry';

    const message = document.createElement('div');

    message.className = 'user-message';
    message.innerText = text;

    wrapper.appendChild(message);

    return wrapper;
  }


  function renderChatHistory() {

    const role = roles[currentRoleKey];
    const history = chatHistory[currentRoleKey];
    const feed = document.getElementById('chatFeed');

    feed.innerHTML = '';

    const time = document.createElement('div');

    time.className = 'time-line';
    time.innerText = '今天';

    feed.appendChild(time);

    history.forEach(item => {

      if (item.type === 'ai') {

        feed.appendChild(
          createAIEntry(
            role.name,
            item.text
          )
        );

      } else {

        feed.appendChild(
          createUserEntry(item.text)
        );
      }

    });

    setTimeout(() => {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }, 40);
  }


  function sendMessage() {

    const input = document.getElementById('chatInput');

    const text = input.value.trim();

    if (!text) {
      return;
    }

    chatHistory[currentRoleKey].push({
      type: 'user',
      text: text
    });

    input.value = '';

    renderChatHistory();

    showTyping();

    setTimeout(() => {
      fakeReply();
    }, 700);
  }


  function handleInputKey(event) {

    if (event.key === 'Enter') {

      event.preventDefault();

      sendMessage();
    }
  }


  function showTyping() {

    const role = roles[currentRoleKey];
    const feed = document.getElementById('chatFeed');

    const typing = document.createElement('div');

    typing.id = 'typing';
    typing.className = 'typing';
    typing.innerText = role.name + '正在想……';

    feed.appendChild(typing);

    setTimeout(() => {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }, 30);
  }


  function fakeReply() {

    const role = roles[currentRoleKey];

    const index = replyIndex[currentRoleKey] % role.replies.length;

    const text = role.replies[index];

    replyIndex[currentRoleKey]++;

    chatHistory[currentRoleKey].push({
      type: 'ai',
      text: text
    });

    renderChatHistory();
  }


  function backToConversation() {

    hideAllScreens();
    hideComposer();

    document.getElementById('conversationScreen').classList.add('active');
    document.getElementById('bottomNav').classList.remove('hidden');

    renderConversations();

    setActiveNav(1);

    window.scrollTo(0, 0);
  }


  function renderConversations() {

    const list = document.getElementById('conversationList');

    list.innerHTML = '';

    knownRoles.forEach(key => {

      const role = roles[key];
      const history = chatHistory[key];

      let preview = role.intro[0].replace(/\n/g, ' ');

      if (history.length > 0) {
        preview = history[history.length - 1].text.replace(/\n/g, ' ');
      }

      const button = document.createElement('button');

      button.className = 'conversation-card';

      button.onclick = function() {
        openChat(key);
      };

      button.innerHTML = `
        <div class="conversation-avatar">
          ${role.initial}
        </div>

        <div class="conversation-main">
          <div class="conversation-name">
            ${role.name}
          </div>

          <div class="conversation-preview">
            ${escapeHTML(preview)}
          </div>
        </div>

        <div class="conversation-time">
          今天
        </div>
      `;

      list.appendChild(button);
    });
  }


  function escapeHTML(text) {

    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function openMemory() {

    const role = roles[currentRoleKey];

    document.getElementById('memoryTitle').innerText =
      role.name + '记得';

    renderMemory(role);

    hideAllScreens();
    hideComposer();

    document.getElementById('memoryScreen').classList.add('active');
    document.getElementById('bottomNav').classList.add('hidden');

    window.scrollTo(0, 0);
  }


  function renderMemory(role) {

    const container = document.getElementById('memoryContent');

    container.innerHTML = '';

    container.appendChild(
      createMemorySection(
        '关于你',
        role.memory.about,
        '关于你'
      )
    );

    container.appendChild(
      createMemorySection(
        '共同经历',
        role.memory.events,
        '共同经历'
      )
    );

    container.appendChild(
      createMemorySection(
        'TA对你的理解',
        role.memory.understanding,
        '关系理解'
      )
    );
  }


  function createMemorySection(title, items, meta) {

    const wrapper = document.createElement('div');

    const heading = document.createElement('div');

    heading.className = 'memory-section-title';
    heading.innerText = title;

    wrapper.appendChild(heading);

    const card = document.createElement('div');

    card.className = 'memory-card';

    if (items.length === 0) {

      const empty = document.createElement('div');

      empty.className = 'empty-memory';
      empty.innerText =
        '你们还没有留下足够多的共同信息。';

      card.appendChild(empty);

    } else {

      items.forEach(text => {

        const item = document.createElement('div');

        item.className = 'memory-item';

        item.innerHTML = `
          <div class="memory-text">
            ${escapeHTML(text)}
          </div>

          <div class="memory-meta">
            ${meta} · 测试数据
          </div>
        `;

        card.appendChild(item);
      });
    }

    wrapper.appendChild(card);

    return wrapper;
  }


  function backToChat() {
    openChat(currentRoleKey);
  }


  function setActiveNav(index) {

    document.querySelectorAll('.nav-item').forEach(
      (item, itemIndex) => {

        item.classList.toggle(
          'active',
          itemIndex === index
        );
      }
    );
  }


  renderConversations();

</script>

</body>
</html>
