<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f7;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 30px 20px 40px;
      display: flex;
      flex-direction: column;
    }

    .name {
      font-size: 18px;
      font-weight: 600;
    }

    .message-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .message {
      font-size: 24px;
      line-height: 1.7;
      text-align: center;
    }

    .continue-button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    .continue-button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="name">TA</div>

    <div class="message-area">
      <div class="message" id="message">
        今天想和你说一句。
      </div>
    </div>

    <button class="continue-button" onclick="nextMessage()">
      继续
    </button>
  </div>

  <script>
    const messages = [
      '今天想和你说一句。',
      '有些答案，不需要今天就找到。',
      '先照顾好现在的自己。'
    ];

    let currentIndex = 0;

    function nextMessage() {
      currentIndex = (currentIndex + 1) % messages.length;
      document.getElementById('message').innerText = messages[currentIndex];
    }
  </script>
</body>
</html>
